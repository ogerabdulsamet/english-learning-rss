name: Daily English RSS Generator

on:
  schedule:
    # Her gün saat 09:00 UTC'de çalış (12:00 Türkiye saati)
    - cron: '0 9 * * *'
  
  # Manuel tetikleme için
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install google-generativeai
      
      - name: Generate RSS feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_LINK: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python generate_rss.py
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update daily RSS feed - $(date +'%Y-%m-%d')" && git push)
